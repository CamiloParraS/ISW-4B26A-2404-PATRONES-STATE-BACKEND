<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ride Dispatch</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="app-wrapper">
      <header class="app-header">
        <span class="header-icon">🚗</span>
        <h1 class="header-title">Ride Dispatch</h1>
        <p class="header-sub">Demo del Patron State</p>
      </header>

      <section id="no-ride" class="empty-state">
        <p class="empty-label">No hay viaje activo</p>
        <button id="btn-new-ride" class="btn btn-primary btn-large">
          + Nuevo viaje
        </button>
      </section>

      <section id="ride-panel" class="ride-panel hidden">
        <div class="ride-meta">
          <span class="label">ID del viaje</span>
          <code id="ride-id" class="ride-id">—</code>
          <button id="btn-copy-id" class="btn-icon" title="Copiar ID">⧉</button>
        </div>

        <div class="state-badge-wrapper">
          <div id="state-badge" class="state-badge">SOLICITANDO</div>
        </div>

        <div id="timeline" class="timeline"></div>

        <div id="action-buttons" class="action-grid"></div>

        <div class="log-panel">
          <p class="label">Registro de actividad</p>
          <ul id="log-list" class="log-list"></ul>
        </div>

        <div class="ride-footer">
          <button id="btn-new-ride-2" class="btn btn-secondary hidden">
            Iniciar nuevo viaje
          </button>
        </div>
      </section>

      <div id="error-toast" class="error-toast hidden"></div>
    </div>

    <script type="module" src="js/api.js"></script>
    <script type="module" src="js/ui.js"></script>
    <script type="module" src="js/app.js"></script>
  </body>
</html>
