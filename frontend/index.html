<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Despacho de Viajes</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="app-wrapper">
      <header class="app-header">
        <div class="header-content">
          <div class="header-text">
            <h1 class="header-title">Ride Slop</h1>
            <p class="header-sub">
              Aplicación que utiliza el patrón STATE para gestionar los estados
              del viaje
            </p>
          </div>
        </div>
        <button id="btn-new-ride" class="btn btn-primary">+ Nuevo Viaje</button>
      </header>

      <section id="no-ride" class="empty-state">
        <p class="empty-label">No hay viajes activos.</p>
        <p class="empty-sub">Crea un nuevo viaje para comenzar.</p>
      </section>

      <section id="rides-container" class="rides-grid"></section>

      <template id="ride-card-template">
        <div class="ride-card">
          <div class="ride-meta">
            <span class="label">Viaje</span>
            <code class="ride-id">—</code>
            <button class="btn-icon btn-copy-id" title="Copiar ID">⧉</button>
          </div>

          <div class="state-badge-wrapper">
            <div class="state-badge">SOLICITANDO</div>
          </div>

          <div class="timeline"></div>

          <div class="action-grid"></div>
        </div>
      </template>

      <div id="error-toast" class="error-toast hidden"></div>
    </div>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
